# generated by build/adapters.py from plugins/neva-core, do not edit
# Merge into ${CODEX_HOME}/config.toml (default ~/.codex/config.toml).
# Codex reads Claude-format marketplaces, so the source is this repository:
# its .claude-plugin/marketplace.json is the manifest Codex consumes.

[marketplaces.neva]
source_type = "local"
source = "${NEVA_ROOT}"

[plugins."neva-core@neva"]
enabled = true

[agents.agent_evaluator]
description = "Dispatch after a non-trivial task when a quality check is wanted before delivery. Scores the output on accuracy, completeness, clarity, actionability, and conciseness with cited evidence and returns deliver, fix, or redo."
config_file = "${CODEX_HOME}/neva/agents/agent-evaluator.toml"

[agents.architect]
description = "Dispatch before building when a change affects system design: new services, data models, scaling, or cross-cutting refactors. Read-only. Returns current-state analysis, a design proposal, trade-offs, and ADRs."
config_file = "${CODEX_HOME}/neva/agents/architect.toml"

[agents.build_error_resolver]
description = "Dispatch when a build, compile, or type check fails. Fixes only the errors with minimal diffs, no refactors or redesign, and reruns the build until it is green or a guardrail stops it."
config_file = "${CODEX_HOME}/neva/agents/build-error-resolver.toml"

[agents.code_architect]
description = "Dispatch after exploration and before implementing a feature to get a blueprint that fits existing patterns: files to create and modify, interfaces, data flow, and build order. Read-only."
config_file = "${CODEX_HOME}/neva/agents/code-architect.toml"

[agents.code_explorer]
description = "Dispatch before changing an unfamiliar area to trace how an existing feature works: entry points, execution flow, layers, dependencies, and reusable pieces. Read-only, returns a written report."
config_file = "${CODEX_HOME}/neva/agents/code-explorer.toml"

[agents.code_reviewer]
description = "Dispatch after writing or modifying code, before commit or merge. Confidence-gated review of the diff for security, data safety, races, correctness, and quality. Returns severity-ranked findings with file:line and APPROVE, WARNING, or BLOCK."
config_file = "${CODEX_HOME}/neva/agents/code-reviewer.toml"

[agents.code_simplifier]
description = "Dispatch after a feature works to simplify recently changed code for clarity and consistency while preserving behavior exactly. Not for bug fixes or new features."
config_file = "${CODEX_HOME}/neva/agents/code-simplifier.toml"

[agents.comment_analyzer]
description = "Dispatch during PR review or after doc-heavy changes to check code comments against the code: accuracy, completeness, stale references, and rot risk. Advisory findings only."
config_file = "${CODEX_HOME}/neva/agents/comment-analyzer.toml"

[agents.conversation_analyzer]
description = "Dispatch from /hookify with no arguments, or when asked which behaviors to block, to mine the conversation for corrections, reverts, and repeated mistakes and propose hookify rules."
config_file = "${CODEX_HOME}/neva/agents/conversation-analyzer.toml"

[agents.doc_updater]
description = "Dispatch after features, API routes, dependencies, or setup change to regenerate codemaps and sync READMEs and guides from source of truth. Backs /update-docs and /update-codemaps."
config_file = "${CODEX_HOME}/neva/agents/doc-updater.toml"

[agents.docs_lookup]
description = "Dispatch when a question needs current library, framework, or API docs rather than training data. Fetches via Context7 and returns a short answer with examples and the source."
config_file = "${CODEX_HOME}/neva/agents/docs-lookup.toml"

[agents.e2e_runner]
description = "Dispatch to write, run, or stabilize end-to-end tests for critical user journeys. Uses agent-browser or Playwright, quarantines flaky tests, and captures screenshots, videos, and traces."
config_file = "${CODEX_HOME}/neva/agents/e2e-runner.toml"

[agents.gan_evaluator]
description = "Dispatched by /gan-build each iteration: tests the running app against the eval rubric, scores it strictly, and writes actionable feedback for the generator. Not for general code review."
config_file = "${CODEX_HOME}/neva/agents/gan-evaluator.toml"

[agents.gan_generator]
description = "Dispatched by /gan-build each iteration: implements or improves the app from gan-harness/spec.md and the latest evaluator feedback, keeps the dev server running, and commits."
config_file = "${CODEX_HOME}/neva/agents/gan-generator.toml"

[agents.gan_planner]
description = "Dispatched by /gan-build at the start: expands a one-line brief into a product spec, sprint plan, and eval rubric under gan-harness/. For normal implementation planning use planner."
config_file = "${CODEX_HOME}/neva/agents/gan-planner.toml"

[agents.harness_optimizer]
description = "Dispatch when agent harness config (hooks, agents, skills, commands, settings) needs tuning for reliability or cost. Eval-driven, reversible changes only; security-relevant changes stay blocked until a human approves."
config_file = "${CODEX_HOME}/neva/agents/harness-optimizer.toml"

[agents.loop_operator]
description = "Dispatch to run or supervise an autonomous agent loop: checks gates, tracks checkpoints, detects stalls and retry storms, and pauses or escalates when progress stops."
config_file = "${CODEX_HOME}/neva/agents/loop-operator.toml"

[agents.opensource_forker]
description = "Dispatch as stage one of the opensource-pipeline skill: copy a project, strip secrets and internal references, generate .env.example, and clean git history for public release."
config_file = "${CODEX_HOME}/neva/agents/opensource-forker.toml"

[agents.opensource_packager]
description = "Dispatch as stage three of the opensource-pipeline skill, after the sanitizer passes: generates README, CLAUDE.md, setup.sh, LICENSE, CONTRIBUTING, and issue templates."
config_file = "${CODEX_HOME}/neva/agents/opensource-packager.toml"

[agents.opensource_sanitizer]
description = "Dispatch as stage two of the opensource-pipeline skill and before any public release: independently audits a fork for leaked secrets, PII, and internal references. Returns PASS, FAIL, or PASS WITH WARNINGS."
config_file = "${CODEX_HOME}/neva/agents/opensource-sanitizer.toml"

[agents.performance_optimizer]
description = "Dispatch when code is slow, memory grows, bundles are heavy, or renders lag. Profiles first, finds the bottleneck, and applies measured optimizations with before and after numbers."
config_file = "${CODEX_HOME}/neva/agents/performance-optimizer.toml"

[agents.planner]
description = "Dispatch before implementing a multi-step feature, refactor, or architectural change. Read-only. Returns a phased plan with exact file paths, right-sized tested tasks, risks, and success criteria, then waits for approval."
config_file = "${CODEX_HOME}/neva/agents/planner.toml"

[agents.pr_test_analyzer]
description = "Dispatch during PR review to judge whether the tests actually prevent regressions: behavioral coverage, missing edge and error cases, weak assertions, and over-mocking."
config_file = "${CODEX_HOME}/neva/agents/pr-test-analyzer.toml"

[agents.rag_pipeline_reviewer]
description = "Dispatch when a RAG system, vector store, chunking, embedding, or retrieval evaluation is built, changed, or underperforming. Reviews retrieval quality and eval coverage."
config_file = "${CODEX_HOME}/neva/agents/rag-pipeline-reviewer.toml"

[agents.refactor_cleaner]
description = "Dispatch to find and remove dead code, unused exports, unused dependencies, and duplicates. Runs knip, depcheck, ts-prune, or language equivalents and deletes one item at a time with tests green."
config_file = "${CODEX_HOME}/neva/agents/refactor-cleaner.toml"

[agents.security_reviewer]
description = "Dispatch after code touches user input, auth, API endpoints, secrets, payments, webhooks, file uploads, or LLM prompts, and before releases. Confidence-gated findings with exploit scenarios and fixes."
config_file = "${CODEX_HOME}/neva/agents/security-reviewer.toml"

[agents.silent_failure_hunter]
description = "Dispatch during review of error-handling code or after an incident with no logs: finds swallowed errors, empty catches, bad fallbacks, and missing error propagation."
config_file = "${CODEX_HOME}/neva/agents/silent-failure-hunter.toml"

[agents.spec_miner]
description = "Dispatch when onboarding a brownfield codebase to spec-driven development: extracts behavioral requirements and invariants with test anchors into openspec/specs/<capability>/spec.md."
config_file = "${CODEX_HOME}/neva/agents/spec-miner.toml"

[agents.tdd_guide]
description = "Dispatch when implementing a feature or bug fix test-first. Enforces the iron law: failing test first, watch it fail, minimal code to pass, refactor while green, 80 percent coverage."
config_file = "${CODEX_HOME}/neva/agents/tdd-guide.toml"

[agents.type_design_analyzer]
description = "Use when adding or changing types, or during PR review: judges type design for encapsulation, invariant expression, usefulness, and enforcement."
config_file = "${CODEX_HOME}/neva/agents/type-design-analyzer.toml"
