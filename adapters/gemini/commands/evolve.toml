prompt = "<!-- Adapted from affaan-m/ECC (MIT), commit d3b8a3e. Merged for Neva. -->\n\n# Evolve Command\n\nProposal first. `/evolve` shows which instincts could become a skill, a command or an agent. With `--propose` it files each candidate as a block in the proposal file for the owner to approve. It never writes a skill, command or agent itself.\n\n## Implementation\n\n```bash\npython3 \"${CLAUDE_PLUGIN_ROOT}/skills/continuous-learning-v2/scripts/instinct-cli.py\" evolve [--propose] [--limit N] [--dry-run]\n```\n\nThe vault comes from `NEVA_VAULT`, else `VAULT_PATH` in `~/.config/neva/identity.env`. If the CLI exits 2, show its message: it names the fix.\n\n## Usage\n\n```\n/evolve                   # print skill, command, agent and promotion candidates; write nothing\n/evolve --propose         # also file every candidate as a proposal block\n/evolve --propose --limit 3\n/evolve --propose --dry-run   # print the blocks that would be filed\n```\n\n## What happens\n\n1. Load the current project's instincts plus global ones (project wins on id clashes). Fewer than 3: stop and say so.\n2. Find candidates:\n   - skill: 2 or more instincts whose triggers share 2 or more keywords (overlap coefficient 0.5 or more)\n   - command: a `workflow` instinct at confidence 0.7 or more\n   - agent: a skill cluster of 3 or more instincts at average confidence 0.75 or more\n   - promotion to global: see `/promote`\n3. Print them. Without `--propose`, nothing is written.\n4. With `--propose`, append one block per candidate to `Instinct promotions YYYY-MM-DD.md` in the proposals folder (default `00 Inbox/`, see the continuous-learning-v2 skill) and add one pointer under `## Open actions` in the inbox note. Each block carries the destination (`<project>/.claude/...` when every member comes from one project, else `~/.claude/...`), the write mode and the exact file text. Candidates already applied or rejected are never filed again.\n\n## Applying\n\n- The owner ticks `approve` or `reject` in a block. The nightly job applies ticked blocks, or run `instinct-cli.py apply-promotions`.\n- Run `apply-promotions --all` only when the owner says \"apply instinct promotions\" in this conversation. Never tick a box yourself.\n- Report afterwards: what was applied, where, and anything that failed with its `Fix:` line.\n\n\n{{args}}\n"
