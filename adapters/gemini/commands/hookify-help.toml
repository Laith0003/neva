prompt = "<!-- Adapted from affaan-m/ECC (MIT), commit d3b8a3e. Merged for Neva. -->\n\nDisplay comprehensive hookify documentation.\n\n## Hook System Overview\n\nHookify creates rule files that integrate with Claude Code's hook system to prevent unwanted behaviors.\n\n### Event Types\n\n- `bash`: triggers on Bash tool use and matches command patterns\n- `file`: triggers on Edit, Write and MultiEdit; a bare pattern matches the file path or the new text\n- `stop`: triggers when the agent finishes a turn; matches the tail of the transcript\n- `prompt`: triggers on user message submission and matches input patterns\n- `all`: triggers on all events\n\n### Rule File Format\n\nFiles are stored as `.claude/hookify.{name}.local.md`:\n\n```yaml\n---\nname: descriptive-name\nenabled: true\nevent: bash|file|stop|prompt|all\naction: block|warn\npattern: \"regex pattern to match\"\n---\nMessage to display when rule triggers.\nSupports multiple lines.\n```\n\n### Commands\n\n- `/hookify [description]` creates new rules and auto-analyzes the conversation when no description is given\n- `/hookify-list` lists configured rules\n- `/hookify-configure` toggles rules on or off\n\n### Pattern Tips\n\n- use regex syntax\n- for `bash`, match against the full command string\n- for `file`, a bare pattern matches the file path or the new text; use `conditions` to target one field\n- test patterns before deploying\n\n## Enforcement\n\nThe neva-core hook runtime reads `.claude/hookify.*.local.md` on every matching event (modules `hookify_pre_tool`, `hookify_prompt`, `hookify_stop`, every profile). Changes apply on the next tool call, no restart. If the user runs without neva-core's hooks, or disabled those ids in `NEVA_DISABLED_HOOKS`, rules are inert: say so when creating or toggling them. A malformed rule is reported once per session and skipped, never enforced.\n\n\n{{args}}\n"
